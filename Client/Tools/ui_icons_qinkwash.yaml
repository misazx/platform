defaults:
  model: "doubao-seedream-5-0-260128"
  gen_size: "2K"
  output_format: "png"
  watermark: false
  concurrency: 5
  retry: 3
  style_prefix: "中国水墨画风格，Q版可爱，传统国画笔触，水墨晕染效果，"
  style_suffix: "，纯色背景透明，游戏UI图标"

batches:
  # ==================== 核心UI图标（UI/目录）====================
  - name: "核心UI图标"
    size: "32x32"
    style: "Q版水墨风格，简洁扁平化游戏图标，单色深墨色，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "icon_coin.png"
        prompt: "一枚圆形金币图标，古代铜钱样式，外圆内方，金色水墨渲染"
        negative: "写实,3D,像素,复杂背景,多色彩"
      - filename: "icon_star.png"
        prompt: "五角星形图标，星光闪烁感，金黄色水墨笔触"
        negative: "写实,3D,像素,复杂背景,多色彩"
      - filename: "icon_heart.png"
        prompt: "心形图标，红色爱心，饱满圆润，水墨晕染边缘"
        negative: "写实,3D,像素,复杂背景,多色彩"
      - filename: "icon_sword.png"
        prompt: "一把剑的图标，直剑造型，锋利剑尖，银灰色金属质感水墨"
        negative: "写实,3D,像素,复杂背景,多色彩"
      - filename: "icon_shield.png"
        prompt: "一面盾牌图标，经典鸢形盾牌，坚固防护感，金属灰蓝色"
        negative: "写实,3D,像素,复杂背景,多色彩"
      - filename: "icon_skull.png"
        prompt: "一个骷髅头图标，简笔画风格骷髅，空洞眼窝，白色骨质感"
        negative: "写实,恐怖,3D,像素,复杂背景"

  - name: "核心UI图标_白色版"
    size: "32x32"
    style: "Q版水墨风格，简洁扁平化游戏图标，纯白色线条描边，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "icon_coin_white.png"
        prompt: "一枚圆形金币图标白色线稿版本，古代铜钱样式，外圆内方，纯白线条"
        negative: "彩色,填充色,写实,3D,像素"
      - filename: "icon_star_white.png"
        prompt: "五角星形图标白色线稿版本，星光闪烁感，纯白线条描边"
        negative: "彩色,填充色,写实,3D,像素"
      - filename: "icon_heart_white.png"
        prompt: "心形图标白色线稿版本，红色爱心轮廓，纯白线条描边"
        negative: "彩色,填充色,写实,3D,像素"
      - filename: "icon_sword_white.png"
        prompt: "一把剑的图标白色线稿版本，直剑造型，纯白线条描边"
        negative: "彩色,填充色,写实,3D,像素"
      - filename: "icon_shield_white.png"
        prompt: "一面盾牌图标白色线稿版本，经典鸢形盾牌，纯白线条描边"
        negative: "彩色,填充色,写实,3D,像素"
      - filename: "icon_skull_white.png"
        prompt: "一个骷髅头图标白色线稿版本，简笔画风格，纯白线条描边"
        negative: "彩色,填充色,写实,恐怖,3D,像素"

  # ==================== 形状和工具图标 ====================
  - name: "形状工具图标"
    size: "24x24"
    style: "极简水墨几何图形，单色深墨，扁平化UI元素，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "icon_square.png"
        prompt: "正方形几何图标，实心方块，水墨填充感"
        negative: "复杂,渐变,3D,阴影"
      - filename: "icon_triangle.png"
        prompt: "三角形几何图标，向上指向，水墨笔触"
        negative: "复杂,渐变,3D,阴影"
      - filename: "icon_ring.png"
        prompt: "圆环几何图标，空心圆圈，粗线条水墨圆环"
        negative: "复杂,渐变,3D,阴影"
      - filename: "icon_circle.png"
        prompt: "圆形几何图标，实心圆点，水墨晕染圆点"
        negative: "复杂,渐变,3D,阴影"
      - filename: "icon_diamond.png"
        prompt: "菱形几何图标，倾斜方形，水墨菱形符号"
        negative: "复杂,渐变,3D,阴影"
      - filename: "icon_dot.png"
        prompt: "小圆点图标，微小实心圆点，水墨点缀"
        negative: "复杂,渐变,3D,阴影"

  - name: "方向箭头图标"
    size: "24x24"
    style: "极简水墨箭头，中国传统书法笔触方向指示，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "icon_arrow_up.png"
        prompt: "向上箭头图标，水墨笔触向上指，简洁有力"
        negative: "复杂,渐变,3D,彩色"
      - filename: "icon_arrow_down.png"
        prompt: "向下箭头图标，水墨笔触向下指，简洁有力"
        negative: "复杂,渐变,3D,彩色"
      - filename: "icon_arrow_left.png"
        prompt: "向左箭头图标，水墨笔触向左指，简洁有力"
        negative: "复杂,渐变,3D,彩色"
      - filename: "icon_arrow_right.png"
        prompt: "向右箭头图标，水墨笔触向右指，简洁有力"
        negative: "复杂,渐变,3D,彩色"

  - name: "确认取消图标"
    size: "24x24"
    style: "极简水墨符号，中国传统印章风格，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "icon_check.png"
        prompt: "对勾确认图标，水墨笔画勾选符号，类似书法✓"
        negative: "复杂,渐变,3D,彩色"
      - filename: "icon_cross.png"
        prompt: "叉号取消图标，水墨笔画X符号，类似书法✗"
        negative: "复杂,渐变,3D,彩色"

  # ==================== 技能图标 ====================
  - name: "战斗技能图标"
    size: "64x64"
    style: "Q版水墨卡牌技能图标，中国传统法术符咒风格，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Skills"
    resources:
      - filename: "fireball.png"
        prompt: "火球术技能图标，一团燃烧的火焰球，红橙色水墨火焰，中国风水墨渲染"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "heal.png"
        prompt: "治疗术技能图标，绿色光芒十字治愈符号，生命恢复感，水墨光效"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "iron_skin.png"
        prompt: "铁甲术技能图标，金属护甲盾牌符号，钢铁防御感，水墨金属质感"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "dash.png"
        prompt: "冲刺技能图标，速度线残影符号，快速移动感，水墨动态线条"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "strike.png"
        prompt: "斩击技能图标，利刃劈砍动作符号，攻击感强烈，水墨刀光"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "defend.png"
        prompt: "格挡技能图标，交叉双臂防御姿态符号，格挡感，水墨盾纹"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "poison.png"
        prompt: "中毒技能图标，紫色毒雾骷髅符号，持续伤害感，水墨毒气"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "weak.png"
        prompt: "虚弱技能图标，向下断裂箭头符号，力量削弱感，水墨裂痕"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "vulnerable.png"
        prompt: "易伤技能图标，破碎盾牌裂纹符号，防御降低感，水墨碎裂"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "strength.png"
        prompt: "力量增益技能图标，向上拳头肌肉符号，力量增强感，水墨气势"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "dexterity.png"
        prompt: "敏捷增益技能图标，奔跑人影符号，速度提升感，水墨残影"
        negative: "写实,3D,像素,现代卡通,动漫"
      - filename: "rage.png"
        prompt: "愤怒状态图标，燃烧怒火头部符号，狂暴状态感，水墨烈焰"
        negative: "写实,3D,像素,现代卡通,动漫"

  # ==================== 道具物品图标 ====================
  - name: "道具物品图标"
    size: "48x48"
    style: "Q版水墨道具图标，中国传统器物画风，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Items"
    resources:
      - filename: "health_potion_small.png"
        prompt: "小型药水瓶图标，红色药水小瓶，玻璃瓶装红色液体，水墨渲染"
        negative: "写实,3D,像素,现代卡通"
      - filename: "health_potion_large.png"
        prompt: "大型药水瓶图标，红色药水大瓶，玻璃瓶装浓稠红色液体，水墨渲染"
        negative: "写实,3D,像素,现代卡通"
      - filename: "iron_sword.png"
        prompt: "铁剑武器图标，一把普通铁制长剑，简单朴素，水墨金属质感"
        negative: "写实,3D,像素,现代卡通"
      - filename: "steel_armor.png"
        prompt: "钢甲防具图标，一套板甲胸甲，金属光泽，水墨金属质感"
        negative: "写实,3D,像素,现代卡通"
      - filename: "gold_bag.png"
        prompt: "钱袋图标，装满金币的布袋，鼓胀的钱袋，水墨布料质感"
        negative: "写实,3D,像素,现代卡通"
      - filename: "key_item.png"
        prompt: "关键物品图标，一把古铜钥匙，神秘钥匙，水墨金属质感"
        negative: "写实,3D,像素,现代卡通"
      - filename: "scroll.png"
        prompt: "卷轴物品图标，一卷展开的古老卷轴，文字符文，水墨纸张"
        negative: "写实,3D,像素,现代卡通"
      - filename: "gem.png"
        prompt: "宝石物品图标，一颗发光的彩色宝石，晶莹剔透，水墨光泽"
        negative: "写实,3D,像素,现代卡通"

  # ==================== 敌人图标 ====================
  - name: "敌人头像图标"
    size: "80x80"
    style: "Q版水墨怪物头像，中国传统志怪画风，可爱但不失威慑力，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Enemies"
    resources:
      - filename: "jaw_worm.png"
        prompt: "颚虫怪物头像图标，巨型蠕虫类怪物，大嘴獠牙，紫褐色身体，Q版水墨风格"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "cultist.png"
        prompt: "邪教徒怪物头像图标，兜帽遮面的神秘人物，暗紫色斗篷，诡异气息，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "lagavulin.png"
        prompt: "拉加沃林酒灵怪物头像图标，酒精蒸汽构成的幽灵，蓝色半透明，醉酒姿态，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "the_guardian.png"
        prompt: "守门人怪物头像图标，石像鬼守卫，岩石皮肤巨兽，厚重铠甲，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "slime_blue.png"
        prompt: "蓝色史莱姆怪物头像图标，果冻状软体生物，Q弹可爱，蓝色半透明，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "slime_red.png"
        prompt: "红色史莱姆怪物头像图标，果冻状软体生物，Q弹凶狠，红色不透明，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "bat.png"
        prompt: "蝙蝠怪物头像图标，巨型蝙蝠生物，翅膀展开，尖锐牙齿，暗黑风格，Q版水墨"
        negative: "写实,恐怖,3D,像素,现代动漫"
      - filename: "skeleton.png"
        prompt: "骷髅战士怪物头像图标，手持武器的骨架战士，空洞眼眶，白色骨骼，Q版水墨"
        negative: "写实,恐怖过度,3D,像素,现代动漫"

  # ==================== 休息站点图标 ====================
  - name: "休息站点图标"
    size: "64x64"
    style: "Q版水墨场景图标，中国传统建筑场景元素，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Rest"
    resources:
      - filename: "default.png"
        prompt: "休息营地图标，篝火帐篷露营场景，温暖安全感的休息地，水墨夜景"
        negative: "写实,3D,像素,现代卡通"
      - filename: "heal.png"
        prompt: "疗愈泉图标，温泉水池冒热气，恢复生命力的泉水，水墨山水"
        negative: "写实,3D,像素,现代卡通"
      - filename: "upgrade.png"
        prompt: "强化锻造图标，铁匠铺打铁场景，火花四溅的熔炉，水墨工坊"
        negative: "写实,3D,像素,现代卡通"
      - filename: "smith.png"
        prompt: "铁匠NPC图标，打铁的铁匠人物形象，锤子铁砧，水墨人物"
        negative: "写实,3D,像素,现代卡通"
      - filename: "recall.png"
        prompt: "回城传送图标，魔法阵传送门符号，时空扭曲感，水墨阵法"
        negative: "写实,3D,像素,现代卡通"
      - filename: "merchant.png"
        prompt: "商人交易图标，行商摊位货架场景，琳琅满目的商品，水墨市集"
        negative: "写实,3D,像素,现代卡通"

  # ==================== 服务/功能图标 ====================
  - name: "服务功能图标"
    size: "48x48"
    style: "Q版水墨功能图标，简洁明了的游戏功能标识，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Services"
    resources:
      - filename: "default.png"
        prompt: "默认服务图标，问号信息符号，未知服务，水墨问号"
        negative: "写实,3D,像素,复杂"
      - filename: "save.png"
        prompt: "存档服务图标，卷轴书册保存符号，记录进度，水墨书卷"
        negative: "写实,3D,像素,复杂"
      - filename: "settings.png"
        prompt: "设置齿轮图标，机械齿轮转轮符号，调整配置，水墨机械"
        negative: "写实,3D,像素,复杂"
      - filename: "help.png"
        prompt: "帮助说明图标，书本灯泡符号，指引帮助，水墨书籍"
        negative: "写实,3D,像素,复杂"
      - filename: "shop.png"
        prompt: "商店购物图标，钱袋天平交易符号，买卖商品，水墨商铺"
        negative: "写实,3D,像素,复杂"

  # ==================== 成就/奖励图标 ====================
  - name: "成就奖励图标"
    size: "48x48"
    style: "Q版水墨成就徽章，中国传统奖章勋章风格，"
    output_dir: "Client/GameModes/base_game/Resources/Icons/Achievements"
    resources:
      - filename: "achievement_combat.png"
        prompt: "战斗成就徽章，交叉剑与盾牌图案，战斗大师，水墨徽章"
        negative: "写实,3D,像素,现代卡通"
      - filename: "achievement_gold.png"
        prompt: "财富成就徽章，金山金库图案，富可敌国，水墨金银"
        negative: "写实,3D,像素,现代卡通"
      - filename: "achievement_speed.png"
        prompt: "速度成就徽章，闪电翅膀图案，疾如风，水墨雷电"
        negative: "写实,3D,像素,现代卡通"
      - filename: "achievement_survive.png"
        prompt: "生存成就徽章，不死鸟浴火重生图案，百战不死，水墨凤凰"
        negative: "写实,3D,像素,现代卡通"
      - filename: "achievement_collect.png"
        prompt: "收集成就徽章，宝箱珍宝图案，收藏家，水墨宝箱"
        negative: "写实,3D,像素,现代卡通"
      - filename: "achievement_secret.png"
        prompt: "秘密成就徽章，神秘眼睛钥匙图案，探索者，水墨秘符"
        negative: "写实,3D,像素,现代卡通"

  # ==================== 状态效果图标 ====================
  - name: "状态效果图标"
    size: "32x32"
    style: "极简水墨状态图标，一目了然的状态标识，"
    output_dir: "Client/GameModes/base_game/Resources/UI"
    resources:
      - filename: "status_buff.png"
        prompt: "增益状态图标，向上绿色箭头，正面buff效果，水墨上扬"
        negative: "复杂,3D,彩色斑斓"
      - filename: "status_debuff.png"
        prompt: "减益状态图标，向下红色箭头，负面debuff效果，水墨下沉"
        negative: "复杂,3D,彩色斑斓"
      - filename: "status_poison.png"
        prompt: "中毒状态图标，紫色水滴骷髅，持续伤害，水墨毒液"
        negative: "复杂,3D,彩色斑斓"
      - filename: "status_burn.png"
        prompt: "灼烧状态图标，橙红火焰符号，持续燃烧，水墨烈焰"
        negative: "复杂,3D,彩色斑斓"
      - filename: "status_freeze.png"
        prompt: "冰冻状态图标，蓝色冰晶符号，无法行动，水墨冰霜"
        negative: "复杂,3D,彩色斑斓"
      - filename: "status_stun.png"
        prompt: "眩晕状态图标，黄色星星旋转符号，昏迷眩晕，水墨星旋"
        negative: "复杂,3D,彩色斑斓"
